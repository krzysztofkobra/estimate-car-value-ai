name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile car_price_model.py api.py analyze_model.py fetch_data.py
      - name: Model tests (kontrakt + niezmienniki)
        run: python test_predictions.py
